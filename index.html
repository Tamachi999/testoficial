<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuestro Universo de Amor ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020208;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    /* --- 1. Intro Overlay --- */
    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(circle at center, #111827 0%, #020208 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 100;
      padding: 24px;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .intro-card {
      max-width: 400px;
      animation: fadeInIntro 1.5s ease-out;
    }

    @keyframes fadeInIntro {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .intro-title {
      font-size: 1.6rem;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 35px;
      color: #e2e8f0;
      letter-spacing: 0.5px;
    }

    .start-btn {
      padding: 16px 35px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      background-size: 200% 200%;
      border: none;
      border-radius: 30px;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
      cursor: pointer;
      outline: none;
      transition: background-position 0.5s, transform 0.2s;
    }

    .start-btn:active { transform: scale(0.96); }

    /* --- 2. Canvas para las Estrellas --- */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
    }

    /* --- 3. Modal de Recuerdos (Glassmorphism) --- */
    #memory-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(2, 2, 8, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #memory-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 25px;
      max-width: 380px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      text-align: center;
      position: relative;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      transform: scale(0.9) translateY(20px);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #memory-modal.active .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-content.secret-theme {
      background: rgba(30, 10, 25, 0.95);
      border: 1px solid rgba(244, 63, 94, 0.5);
      box-shadow: 0 0 50px rgba(244, 63, 94, 0.4);
      padding: 35px 25px;
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 1.6rem;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
    }

    .memory-title {
      font-size: 1.35rem;
      margin-bottom: 5px;
      color: #f8fafc;
      font-weight: 600;
    }

    .memory-date {
      font-size: 0.85rem;
      color: #f9a8d4;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 500;
    }

    /* Fotos y Video ampliados a 280px de altura */
    .memory-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 18px;
      background-color: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .memory-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #d1d5db;
      font-weight: 400;
    }

    .modal-content.secret-theme .memory-text {
      font-size: 1.15rem;
      color: #ffe4e6;
      line-height: 1.7;
      margin-top: 10px;
    }

    /* --- 4. Pie de Página --- */
    #time-counter {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.88rem;
      white-space: nowrap;
      z-index: 10;
      opacity: 0;
      transition: opacity 1s ease, background-color 0.5s ease, border-color 0.5s ease;
      pointer-events: none;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.3px;
      text-align: center;
    }

    #time-counter.visible { opacity: 1; }

    #time-counter.shake-alert {
      background: rgba(157, 23, 77, 0.85);
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: #fff;
      font-weight: 600;
      animation: pulseAlert 1.5s infinite;
      pointer-events: auto;
      cursor: pointer;
    }

    @keyframes pulseAlert {
      0%, 100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
      50% { transform: translateX(-50%) scale(1.03); box-shadow: 0 0 25px rgba(244, 63, 94, 0.8); }
    }

    #timer {
      font-weight: 600;
      color: #a5b4fc;
    }
  </style>
</head>
<body>

  <!-- Mensaje de Entrada -->
  <div id="intro-overlay">
    <div class="intro-card">
      <p class="intro-title">Hay momentos que brillan para siempre...<br><br>y estos 6 meses contigo han sido un universo entero.</p>
      <button class="start-btn" id="start-btn">Explorar nuestro cielo ✨</button>
    </div>
  </div>

  <!-- Lienzo Interactivo -->
  <canvas id="starfield"></canvas>

  <!-- Modal Emergente (Recuerdo) -->
  <div id="memory-modal">
    <div class="modal-content" id="modal-card">
      <span class="close-btn" id="close-modal">&times;</span>
      <h2 class="memory-title" id="modal-title"></h2>
      <p class="memory-date" id="modal-date"></p>
      
      <!-- Soporte para Imagen -->
      <img class="memory-img" id="modal-img" src="" alt="Recuerdo">
      
      <!-- Soporte para Video en Bucle -->
      <video class="memory-img" id="modal-video" src="" autoplay loop muted playsinline style="display: none;"></video>
      
      <p class="memory-text" id="modal-text"></p>
    </div>
  </div>

  <!-- Pie de Página Dinámico -->
  <footer id="time-counter">
    <span id="counter-label">Juntos hace: <span id="timer">Cargando...</span></span>
  </footer>

  <script>
    // --- 1. DATOS DE LOS RECUERDOS Y CARTA FINAL (SIN IMAGEN) ---
    const memories = [
      { id: 1, x: 0.20, y: 0.20, title: "Mes 1: El Comienzo", date: "20 ABRIL", text: "El día que nuestro universo empezó a expandirse. ¡Qué suerte encontrarte!", img: "abr.jpg" },
      { id: 2, x: 0.75, y: 0.25, title: "Mes 2: Primeras Risas", date: "20 MAYO", text: "Aquella cita donde supe que no quería separarme de ti nunca.", img: "may.jpg" },
      { id: 3, x: 0.45, y: 0.45, title: "Mes 3: Conexión", date: "20 JUNIO", text: "Tres meses intensos, llenos de cariño y de descubrirnos.", img: "jun.jpg" },
      { id: 4, x: 0.85, y: 0.65, title: "Mes 4: Aventuras Juntos", date: "20 JULIO", text: "Cada viaje, cada paseo, cada momento a tu lado es mi favorito.", img: "jul.jpg" },
      { id: 5, x: 0.25, y: 0.75, title: "Mes 5: Más Fuerte", date: "20 AGOSTO", text: "Gracias por ser mi apoyo, mi sonrisa y mi hogar.", video: "ago.mp4" },
      { id: 6, x: 0.65, y: 0.85, title: "Medio Año", date: "20 SEPTIEMBRE", text: "Seis meses maravillosos. Esto es solo el principio de nuestro viaje eterno.", img: "sep.jpg" }
    ];

    const secretLetter = {
      title: "Lo que nunca te dije...",
      date: "SECRETO DEL UNIVERSO 💖",
      text: "Hay algo que lleva tiempo guardado en mi corazón y que este universo ya no puede contener más... Gracias por estos 6 meses increíbles. Te amo."
    };

    const startDate = new Date(2026, 3, 20, 0, 0, 0); 
    const visitedMemories = new Set();
    let secretUnlocked = false;

    // --- 2. CANVAS & PARTÍCULAS ---
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let width, height;

    let bgStars = [];
    let flowParticles = [];
    let burstParticles = [];

    class FlowParticle {
      constructor(startX, startY, endX, endY) {
        this.startX = startX;
        this.startY = startY;
        this.endX = endX;
        this.endY = endY;
        this.life = Math.random();
        this.speed = 0.002 + Math.random() * 0.003;
        this.size = Math.random() * 1.5;
        this.color = Math.random() > 0.5 ? "#f9a8d4" : "#a5b4fc";
      }

      update() {
        this.life += this.speed;
        if (this.life >= 1) this.life = 0;
      }

      draw() {
        const curvelineFactor = 0.15;
        const midX = (this.startX + this.endX) / 2 + (this.endY - this.startY) * curvelineFactor;
        const midY = (this.startY + this.endY) / 2 + (this.startX - this.endX) * curvelineFactor;
        const t = this.life;
        const cx = (1 - t) * (1 - t) * this.startX + 2 * (1 - t) * t * midX + t * t * this.endX;
        const cy = (1 - t) * (1 - t) * this.startY + 2 * (1 - t) * t * midY + t * t * this.endY;

        ctx.fillStyle = this.color;
        ctx.globalAlpha = t < 0.2 ? t * 5 : (t > 0.8 ? (1 - t) * 5 : 1);
        ctx.beginPath();
        ctx.arc(cx, cy, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    class BurstParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = 2 + Math.random() * 8;
        this.friction = 0.96;
        this.size = 2 + Math.random() * 4;
        this.color = ['#f43f5e', '#fbbf24', '#f9a8d4', '#ffffff'][Math.floor(Math.random() * 4)];
        this.alpha = 1;
        this.decay = 0.008 + Math.random() * 0.015;
      }

      update() {
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.alpha -= this.decay;
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initBgStars();
      initFlowParticles();
    }

    function initBgStars() {
      bgStars = [];
      for (let i = 0; i < 200; i++) {
        bgStars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.2,
          alpha: Math.random(),
          speed: 0.005 + Math.random() * 0.01
        });
      }
    }

    function initFlowParticles() {
      flowParticles = [];
      for (let i = 0; i < memories.length - 1; i++) {
        const start = memories[i];
        const end = memories[i + 1];
        for (let j = 0; j < 30; j++) {
          flowParticles.push(new FlowParticle(start.x * width, start.y * height, end.x * width, end.y * height));
        }
      }
    }

    function triggerBurst() {
      burstParticles = [];
      for (let i = 0; i < 150; i++) {
        burstParticles.push(new BurstParticle(width / 2, height / 2));
      }
    }

    function draw(time) {
      ctx.clearRect(0, 0, width, height);

      bgStars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.globalAlpha = Math.abs(star.alpha);
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      flowParticles.forEach(p => { p.update(); p.draw(); });

      burstParticles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) burstParticles.splice(index, 1);
      });

      memories.forEach((m, index) => {
        const x = m.x * width;
        const y = m.y * height;
        const pulse = Math.sin(time * 0.002 + index) * 0.5 + 0.5;

        const nebulaGradient = ctx.createRadialGradient(x, y, 0, x, y, 35 + pulse * 10);
        nebulaGradient.addColorStop(0, 'rgba(139, 92, 246, 0.3)');
        nebulaGradient.addColorStop(1, 'rgba(2, 2, 8, 0)');
        ctx.fillStyle = nebulaGradient;
        ctx.beginPath();
        ctx.arc(x, y, 45 + pulse * 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.5 + pulse * 0.3;
        ctx.fillStyle = index % 2 === 0 ? "#a5b4fc" : "#f9a8d4";
        ctx.beginPath();
        ctx.arc(x, y, 10 + pulse * 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(index + 1, x, y + 25);
      });

      requestAnimationFrame(draw);
    }

    // --- 3. INTERACCIÓN Y NAVEGACIÓN ---
    window.addEventListener('resize', resize);
    resize();

    canvas.addEventListener('click', (e) => {
      if (introOverlay.style.visibility !== 'hidden' && introOverlay.style.opacity !== '0') return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      memories.forEach(m => {
        const starX = m.x * width;
        const starY = m.y * height;
        if (Math.hypot(clickX - starX, clickY - starY) < 40) {
          openModal(m);
        }
      });
    });

    const modal = document.getElementById('memory-modal');
    const modalCard = document.getElementById('modal-card');
    const closeModalBtn = document.getElementById('close-modal');

    function openModal(memory, isSecret = false) {
      if (!isSecret) visitedMemories.add(memory.id);

      document.getElementById('modal-title').innerText = memory.title;
      document.getElementById('modal-date').innerText = memory.date;
      document.getElementById('modal-text').innerText = memory.text;

      const imgElem = document.getElementById('modal-img');
      const videoElem = document.getElementById('modal-video');

      // Gestión de Imagen / Video / Ocultar en sorpresa final
      if (isSecret) {
        imgElem.style.display = 'none';
        videoElem.style.display = 'none';
        imgElem.src = '';
        videoElem.src = '';
      } else if (memory.video) {
        imgElem.style.display = 'none';
        imgElem.src = '';

        videoElem.src = memory.video;
        videoElem.style.display = 'block';
        videoElem.play();
      } else {
        videoElem.style.display = 'none';
        videoElem.pause();
        videoElem.src = '';

        imgElem.src = memory.img;
        imgElem.style.display = 'block';
      }

      if (isSecret) {
        modalCard.classList.add('secret-theme');
      } else {
        modalCard.classList.remove('secret-theme');
      }

      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
      setTimeout(() => {
        const videoElem = document.getElementById('modal-video');
        const imgElem = document.getElementById('modal-img');
        
        videoElem.pause();
        videoElem.src = "";
        imgElem.src = "";
      }, 300);

      if (visitedMemories.size === memories.length && !secretUnlocked) {
        activateShakePrompt();
      }
    }

    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    // --- 4. SENSOR DE MOVIMIENTO (SHAKE GESTURE) ---
    const footer = document.getElementById('time-counter');
    const footerLabel = document.getElementById('counter-label');

    function activateShakePrompt() {
      footer.classList.add('shake-alert');
      footerLabel.innerHTML = "✨ ¡Agita tu teléfono para una última sorpresa! ✨";
      footer.onclick = triggerSecretSurprise;

      if (window.DeviceMotionEvent) {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          DeviceMotionEvent.requestPermission().then(state => {
            if (state === 'granted') window.addEventListener('devicemotion', handleMotion);
          });
        } else {
          window.addEventListener('devicemotion', handleMotion);
        }
      }
    }

    let lastX = null, lastY = null, lastZ = null;
    const shakeThreshold = 15;

    function handleMotion(e) {
      const current = e.accelerationIncludingGravity;
      if (!current) return;

      if (lastX !== null) {
        const deltaX = Math.abs(current.x - lastX);
        const deltaY = Math.abs(current.y - lastY);
        const deltaZ = Math.abs(current.z - lastZ);

        if (deltaX + deltaY + deltaZ > shakeThreshold) {
          triggerSecretSurprise();
        }
      }

      lastX = current.x;
      lastY = current.y;
      lastZ = current.z;
    }

    function triggerSecretSurprise() {
      if (secretUnlocked) return;
      secretUnlocked = true;

      window.removeEventListener('devicemotion', handleMotion);
      footer.classList.remove('shake-alert');
      footer.onclick = null;
      footerLabel.innerHTML = 'Juntos hace: <span id="timer"></span>';

      triggerBurst();

      setTimeout(() => {
        openModal(secretLetter, true);
      }, 400);
    }

    // --- 5. FLUJO E INICIO ---
    const startBtn = document.getElementById('start-btn');
    const introOverlay = document.getElementById('intro-overlay');

    startBtn.addEventListener('click', () => {
      introOverlay.style.opacity = '0';
      introOverlay.style.visibility = 'hidden';
      setTimeout(() => footer.classList.add('visible'), 500);

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().catch(() => {});
      }
    });

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      const timerElem = document.getElementById('timer');
      if (timerElem) {
        timerElem.innerText = `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }
    }

    requestAnimationFrame(draw);
    setInterval(updateCounter, 1000);
    updateCounter();
  </script>
</body>
</html>
